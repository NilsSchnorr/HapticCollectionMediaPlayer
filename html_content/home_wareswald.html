<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Römisches Leben im Wareswald – Mediastation</title>
    <style>
        /* ------------------------------------------------------------
           Startbildschirm (Ruhezustand) der Mediastation.
           Umbrella-Farbwelt der Ausstellung "Römisches Leben im
           Wareswald": warmes Creme, Olivgrün, dunkles Blau.
           ------------------------------------------------------------ */
        :root {
            --paper:  #F1EDDF;   /* Creme-Hintergrund */
            --olive:  #83864B;   /* Olivgrün (Eyebrow, Initiale, Akzentring) */
            --olive2: #9A9878;   /* gedämpftes Oliv (Rahmen/Sekundärtext) */
            --navy:   #1A2250;   /* dunkles Blau (Titel, Prompt, Ring) */
            --line:   #B9B58C;   /* Rahmenlinie außen */
            --line2:  #D7D3B3;   /* Rahmenlinie innen */
            --muted:  #6A6A5C;   /* gedämpfter Hinweistext */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background-color: var(--paper);
            color: var(--navy);
            font-family: Cambria, Georgia, 'Times New Roman', serif;
        }
        .stage { position: relative; height: 100vh; width: 100vw; }
        .frame  { position: absolute; inset: 1.8vh 1.4vw; border: 1px solid var(--line); pointer-events: none; }
        .frame2 { position: absolute; inset: 2.5vh 1.9vw; border: 1px solid var(--line2); pointer-events: none; }

        .content {
            position: relative; height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-between;
            padding: 5.5vh 6vw;
        }

        .eyebrow {
            text-align: center;
            font-size: clamp(0.75rem, 1.6vh, 1.1rem);
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: var(--olive);
        }

        .center { text-align: center; margin-top: -1vh; }

        h1 {
            font-size: clamp(2.2rem, 6.6vh, 4.6rem);
            font-weight: 700;
            line-height: 1.05;
            color: var(--navy);
        }
        h1 .dropcap {
            color: var(--olive);
            font-size: 1.32em;
            line-height: 0;
            vertical-align: -0.06em;
        }
        .subtitle {
            font-size: clamp(1rem, 2.6vh, 1.7rem);
            font-style: italic;
            color: var(--navy);
            opacity: 0.9;
            margin-top: 1.1vh;
        }

        /* --- abstrakter NFC-Indikator (kein Objekt) --- */
        .reader { position: relative; width: clamp(84px, 12vh, 130px); height: clamp(84px, 12vh, 130px); margin: 4.4vh auto 3.6vh; }
        .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--navy); animation: pulse 2.6s ease-out infinite; }
        .ring.b { border-color: var(--olive); animation-delay: 0.87s; }
        .ring.c { animation-delay: 1.74s; }
        .dot { position: absolute; top: 50%; left: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--navy); }
        @keyframes pulse { 0% { transform: scale(0.5); opacity: 0.85; } 100% { transform: scale(1.5); opacity: 0; } }

        .prompt { font-size: clamp(1.05rem, 2.7vh, 1.75rem); color: var(--navy); }
        .prompt-sub { font-size: clamp(0.8rem, 1.7vh, 1.1rem); color: var(--muted); margin-top: 0.7vh; }

        /* ---------------- Fußzeile mit Partnerlogos ---------------- */
        footer {
            border-top: 1px solid var(--olive2);
            padding-top: 2.4vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(2.5rem, 6vw, 6rem);
        }
        footer img { height: clamp(30px, 4.4vh, 52px); width: auto; display: block; }
        footer img.novus { height: clamp(38px, 5.6vh, 66px); }  /* gestapeltes Logo etwas größer */
    </style>
</head>
<body>
  <div class="stage">
    <div class="frame"></div>
    <div class="frame2"></div>
    <div class="content">

      <div class="eyebrow">Vicus &middot; Wareswald &middot; 2026</div>

      <div class="center">
        <h1><span class="dropcap">R</span>&ouml;misches Leben im Wareswald</h1>
        <div class="subtitle">Vergangenheit digital entdecken</div>

        <div class="reader">
          <div class="ring a"></div>
          <div class="ring b"></div>
          <div class="ring c"></div>
          <div class="dot"></div>
        </div>

        <div class="prompt">Legen Sie ein Objekt auf den Medienstation</div>
        <div class="prompt-sub">Nehmen Sie es wieder herunter, um die Station zur&uuml;ckzusetzen</div>
      </div>

      <footer>
        <img class="novus" src="images/logos_vicus_wareswald/novus.png" alt="Novus Stiftung">
        <img class="theu"  src="images/logos_vicus_wareswald/theulegium.png" alt="Museum Theulegium">
        <img class="uni"   src="images/logos_vicus_wareswald/uni_saarland.png" alt="Universität des Saarlandes">
      </footer>

    </div>
  </div>
</body>
</html>
